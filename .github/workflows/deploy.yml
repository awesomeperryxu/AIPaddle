name: Deploy

# 0.8 自动化部署：push main → SSH 到服务器拉取最新 main、构建、PM2 重启，再冒烟检查
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 同一时间只允许一个生产部署，避免多次 push 并发部署互相干扰
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── OPS-2：构建搬离生产服务器（2026-08-07）────────────────────────────
  # #201 修好了「退出码取反把构建失败谎报成部署成功」，但**构建为什么会失败**
  # 没有解决：生产机是 4 核 7.6G，上面同时跑着 AIPaddle / interview / deskmate /
  # Dify 全家桶 / openclaw。实测 `next build` 单独吃掉 **289% CPU + 1.86GB 内存**，
  # 而构建开始时空闲内存只剩 236MB、swap 已用 3.0G/4.0G ——
  # 被内核 OOM killer 杀掉（exit 137）是必然而非偶发，#187 与 #189 都栽在这；
  # 构建期间线上 load average 冲到 200+，SSH 每条命令都要重试。
  #
  # runner 是空闲的 4 核 16G。构建放这里：线上零争抢、不再 OOM，
  # 且构建失败由 Actions 原生判定，不必再依赖 ssh 脚本里的退出码捕获。
  #
  # ⚠️ 前置条件已核对：`NEXT_PUBLIC_*` 是**构建期烤进前端包**的，runner 上必须与
  #    生产一致。实测三处完全吻合——生产 .env.local、代码实际引用、CI secrets
  #    都只有 NEXT_PUBLIC_SUPABASE_URL 与 NEXT_PUBLIC_SUPABASE_ANON_KEY。
  #    🔴 今后新增任何 NEXT_PUBLIC_* 变量，**必须同步加到本 job 的 env**，
  #    否则线上前端会拿到空值，且构建与运行都不报错。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 构建
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: 打包产物（排除 cache）
        run: |
          # .next/cache 是构建缓存，服务器运行时用不到，却占了体积的绝大部分。
          # 实测：含 cache 的 .next 在服务器上是 831MB，排除后打包只有 16MB。
          tar czf next-build.tar.gz --exclude='./cache' -C .next .
          ls -lh next-build.tar.gz | awk '{print ">> 产物大小: "$5}'

      - uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: next-build.tar.gz
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 准备部署密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - uses: actions/download-artifact@v4
        with:
          name: next-build-${{ github.sha }}

      - name: 上传产物到服务器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            next-build.tar.gz "ubuntu@${DEPLOY_HOST}:/tmp/next-build.tar.gz"
          echo ">> 产物已上传"

      - name: SSH 部署到服务器（原子构建切换 · BUG-87 加固）
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "ubuntu@${DEPLOY_HOST}" "GH_PAT='${GH_PAT}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aipaddle
          export PATH="$HOME/.local/share/pnpm:$PATH"

          # ── OPS-3：与 scripts/deploy.sh 共用同一把锁 ────────────────────
          # 🔴 2026-08-07 生产故障：本工作流与 scripts/deploy.sh 是两条独立路径，
          #    此前只有 deploy.sh 持锁，两边零互斥。当时服务器上同时跑了两个
          #    `next build`，7.6G 内存被吃穿触发 OOM killer（16:40 dmesg 有记录）。
          #    OPS-2 把 CI 构建搬去 runner 后，这里已不再构建，但**互斥依然必需**：
          #    源码 git reset 与产物原子切换若与应急手工部署重叠，
          #    照样会把两次部署的源码和产物错配。锁必须是同一把，否则等于没锁。
          # 拿不到锁 = 另一次部署正在进行，它部署的代码只会更新不会更旧，
          # 直接跳过是安全的；此时尚未改动任何文件，不需要回滚。
          exec 9>/tmp/aipaddle-deploy.lock
          if ! flock -w 900 9; then
            echo ">> 跳过：另一次部署仍在进行（等待 900s 未获锁）"
            exit 0
          fi

          # ── OPS-3：清理孤儿构建进程 ────────────────────────────────────
          # 🔴 CI 已不在此机构建（OPS-2），但 scripts/deploy.sh --force-manual
          #    这条应急路径仍在服务器上跑 `next build`。它被中断时（ssh 断开只杀
          #    客户端，杀不掉远端已起的进程）会留下孤儿继续吃内存——
          #    2026-08-07 现场抓到 3 个，正是 OOM 的直接推手。
          #    持锁后仍存在的 build 必然是孤儿（正常部署都在锁内），按运行时长清理。
          for pid in $(pgrep -f "next build" 2>/dev/null || true); do
            et=$(ps -o etimes= -p "$pid" 2>/dev/null | tr -d ' ' || true)
            if [ -n "$et" ] && [ "$et" -gt 1800 ]; then
              echo ">> 清理孤儿构建进程 $pid（已运行 ${et}s）"
              kill -9 "$pid" 2>/dev/null || true
            fi
          done

          # 保留 .env.local（密钥只存服务器，不进 GitHub）
          cp -f .env.local /tmp/aipaddle.env.bak 2>/dev/null || true

          # ── OPS-1：记录切换前的源码版本，供失败时回退 ──────────────
          # 🔴 源码切换（git reset）在构建之前，构建一旦失败就会留下
          #    「新源码 + 旧 .next」的半更新态——2026-08-05 两次 OOM 失败正是如此，
          #    仅因 pm2 未重启才没炸；进程一旦重启就复现「多路由 500 + 误导性
          #    InvariantError」那场生产故障。故失败时必须把源码退回去。
          PREV_SHA=$(git rev-parse HEAD)
          echo ">> 当前线上源码版本 $PREV_SHA（失败将回退至此）"

          # 🔴 必须用 EXIT trap 而非 ERR trap：脚本里多处显式 `exit 1`，
          #    exit 不触发 ERR trap，回滚会静默失效（本仓 2026-08-03 踩过同一条）。
          DEPLOY_OK=0
          cleanup() {
            if [ "$DEPLOY_OK" != "1" ]; then
              echo ">> 部署未成功：源码回退到 $PREV_SHA，避免留下「新源码 + 旧构建」半更新态"
              git reset --hard "$PREV_SHA" >/dev/null 2>&1 \
                || echo "警告：源码回退失败，请人工检查 /opt/aipaddle 的 git 状态"
            fi
          }
          # 🔴 OPS-3：只 trap EXIT 不够——取消工作流时 runner 杀 ssh 客户端，
          #    远端 bash 收到的是 HUP/PIPE（写回显时管道已断）而非正常退出，
          #    bash 对**未捕获的致命信号**不会执行 EXIT trap，回滚静默失效。
          #    2026-08-07 线上就卡在「源码 9c1c6d1 + .next 停在 15:48」这种半更新态，
          #    页面刷新看到的一直是一个半小时前的旧产物。信号必须逐个显式捕获。
          trap cleanup EXIT INT TERM HUP PIPE

          # 用 Actions 临时 token 拉取私有仓库最新 main（一次性 URL，不写入 remote）
          git fetch "https://x-access-token:${GH_PAT}@github.com/awesomeperryxu/AIPaddle.git" main
          TARGET_SHA=$(git rev-parse FETCH_HEAD)

          # 🔴 防回退：目标比线上**旧**就不切换。
          # concurrency 保证部署串行，但排队中的任务醒来后仍可能拿到比线上旧的提交
          # （极端情况：main 被 revert / force-push）。目标是当前 HEAD 的祖先即视为回退。
          # 不失败退出——这不是错误，是「已经有更新的版本在线上了」，直接跳过即可，
          # 否则会白白触发 EXIT trap 的源码回退。
          if [ "$TARGET_SHA" != "$PREV_SHA" ] && git merge-base --is-ancestor "$TARGET_SHA" "$PREV_SHA"; then
            echo ">> 跳过：目标 $TARGET_SHA 比线上 $PREV_SHA 旧，线上已是更新的版本"
            DEPLOY_OK=1   # 置位，别让 EXIT trap 把线上源码往回退
            exit 0
          fi

          git reset --hard "$TARGET_SHA"

          # 恢复/校验 .env.local
          [ -f .env.local ] || cp -f /tmp/aipaddle.env.bak .env.local 2>/dev/null || true
          [ -f .env.local ] || { echo "FATAL: /opt/aipaddle/.env.local 缺失，终止部署"; exit 1; }

          pnpm install --frozen-lockfile

          # ── 原子构建切换（BUG-87）──────────────────────────────
          # 关键：绝不在构建前删/动线上 .next。先构建到临时目录 .next.new，
          # 校验完整后再原子换成 .next；构建或校验失败则线上 .next 与运行进程纹丝不动。
          rm -rf .next.new
          mkdir -p .next.new
          echo ">> 解包 runner 构建好的产物到 .next.new（线上 .next 不受影响）"
          echo ">> 解包前内存：$(free -m | awk '/^Mem:/{print "可用 "$7"MB / 共 "$2"MB"}')，swap $(free -m | awk '/^Swap:/{print "已用 "$3"MB / 共 "$2"MB"}')"
          # 🔴 OPS-2：服务器不再执行 `next build`，改为解包 runner 传来的产物。
          # #201 修好了「退出码取反把失败谎报成成功」，但**构建为什么会失败**没解决：
          # 生产机 4 核 7.6G 同时跑着 AIPaddle / interview / deskmate / Dify 全家桶 /
          # openclaw，实测 next build 单独吃掉 289% CPU + 1.86GB 内存，而构建开始时
          # 空闲内存只剩 236MB、swap 已用 3.0G/4.0G —— 被 OOM killer 杀掉是必然而非偶发，
          # 期间线上 load average 冲到 200+。搬到 runner 后这里只解包，占用接近零。
          RC=0
          tar xzf /tmp/next-build.tar.gz -C .next.new || RC=$?
          rm -f /tmp/next-build.tar.gz
          if [ "$RC" -ne 0 ]; then
            echo "FATAL: 产物解包失败（exit $RC）——产物损坏或磁盘空间不足"
            df -h / | tail -1
            rm -rf .next.new
            # 同 #201：一律以非零退出，别让失败再伪装成成功
            [ "$RC" -ne 0 ] && exit "$RC" || exit 1
          fi
          echo ">> 校验新构建完整性"
          MISSING=""
          for f in .next.new/BUILD_ID .next.new/prerender-manifest.json .next.new/required-server-files.json .next.new/routes-manifest.json; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          [ -d .next.new/static ] || MISSING="$MISSING .next.new/static/"
          if [ -n "$MISSING" ]; then
            echo "FATAL: 新构建不完整，缺:$MISSING —— 放弃切换，线上保持旧版本"
            rm -rf .next.new
            exit 1
          fi

          echo ">> 原子切换 .next.new → .next（保留旧版 .next.old 供回滚）"
          rm -rf .next.old
          mv .next .next.old
          mv .next.new .next
          # fork 模式用 restart（reload 在 fork 模式不保证干净重启），强制进程重读新 .next
          pm2 restart aipaddle --update-env

          # 真实健康检查：直连 :3000 请求一个 CSS 静态资源，连续拿到 200 才算健康。
          # 任何原因（进程崩/静态 500/构建怪异）导致不健康 → 自动回滚到旧构建 .next.old，
          # 保证线上永远不停在坏状态（BUG-86 裸奔的根治性防线）。
          CSSFILE=$(ls .next/static/css/*.css 2>/dev/null | head -1 | xargs -r -n1 basename 2>/dev/null || true)
          PROBE="http://localhost:3000/login"
          [ -n "$CSSFILE" ] && PROBE="http://localhost:3000/_next/static/css/$CSSFILE"
          HEALTHY=0; CODE=""
          for i in 1 2 3 4 5 6 7 8; do
            sleep 2
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$PROBE" || true)
            [ "$CODE" = "200" ] && { HEALTHY=$((HEALTHY+1)); } || HEALTHY=0
            [ "$HEALTHY" -ge 3 ] && break   # 连续 3 次 200 才判健康，防抖
          done
          if [ "$HEALTHY" -lt 3 ]; then
            echo "FATAL: 新版本健康检查失败（最后 code=$CODE, probe=$PROBE）→ 回滚旧构建 .next.old"
            rm -rf .next.broken; mv .next .next.broken; mv .next.old .next
            pm2 restart aipaddle --update-env
            exit 1
          fi

          # 🔴 只有走到这里才算成功——置标志，否则 EXIT trap 会把刚上线的源码退回去
          DEPLOY_OK=1
          pm2 save
          echo "部署完成（健康检查连续 3×200）: $(git log --oneline -1)"
          REMOTE

      - name: 冒烟检查（login + CSS 静态资源都要 200）
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            login=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://aipaddle.net/login || true)
            # 从 login HTML 里取第一个 CSS 资源，验证静态资源也能 200（防"进程崩→静态 500"裸奔）
            css=$(curl -s --max-time 15 https://aipaddle.net/login | grep -oE '/_next/static/css/[a-f0-9]+\.css' | head -1 || true)
            csscode="none"
            [ -n "$css" ] && csscode=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://aipaddle.net${css}" || true)
            if [ "$login" = "200" ] && [ "$csscode" = "200" ]; then
              echo "冒烟通过：login=200, css($css)=200"; ok=1; break
            fi
            echo "第 $i 次: login=$login css=$csscode，10s 后重试…"; sleep 10
          done
          [ "$ok" = "1" ] || { echo "冒烟失败：login 或 CSS 未稳定 200"; exit 1; }
