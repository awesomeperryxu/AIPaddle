name: Deploy

# 0.8 自动化部署：push main → SSH 到服务器拉取最新 main、构建、PM2 重启，再冒烟检查
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 同一时间只允许一个生产部署，避免多次 push 并发部署互相干扰
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 准备部署密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: SSH 部署到服务器（原子构建切换 · BUG-87 加固）
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "ubuntu@${DEPLOY_HOST}" "GH_PAT='${GH_PAT}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aipaddle
          export PATH="$HOME/.local/share/pnpm:$PATH"

          # 保留 .env.local（密钥只存服务器，不进 GitHub）
          cp -f .env.local /tmp/aipaddle.env.bak 2>/dev/null || true

          # ── OPS-1：记录切换前的源码版本，供失败时回退 ──────────────
          # 🔴 源码切换（git reset）在构建之前，构建一旦失败就会留下
          #    「新源码 + 旧 .next」的半更新态——2026-08-05 两次 OOM 失败正是如此，
          #    仅因 pm2 未重启才没炸；进程一旦重启就复现「多路由 500 + 误导性
          #    InvariantError」那场生产故障。故失败时必须把源码退回去。
          PREV_SHA=$(git rev-parse HEAD)
          echo ">> 当前线上源码版本 $PREV_SHA（失败将回退至此）"

          # 🔴 必须用 EXIT trap 而非 ERR trap：脚本里多处显式 `exit 1`，
          #    exit 不触发 ERR trap，回滚会静默失效（本仓 2026-08-03 踩过同一条）。
          DEPLOY_OK=0
          cleanup() {
            if [ "$DEPLOY_OK" != "1" ]; then
              echo ">> 部署未成功：源码回退到 $PREV_SHA，避免留下「新源码 + 旧构建」半更新态"
              git reset --hard "$PREV_SHA" >/dev/null 2>&1 \
                || echo "警告：源码回退失败，请人工检查 /opt/aipaddle 的 git 状态"
            fi
          }
          trap cleanup EXIT

          # 用 Actions 临时 token 拉取私有仓库最新 main（一次性 URL，不写入 remote）
          git fetch "https://x-access-token:${GH_PAT}@github.com/awesomeperryxu/AIPaddle.git" main
          git reset --hard FETCH_HEAD

          # 恢复/校验 .env.local
          [ -f .env.local ] || cp -f /tmp/aipaddle.env.bak .env.local 2>/dev/null || true
          [ -f .env.local ] || { echo "FATAL: /opt/aipaddle/.env.local 缺失，终止部署"; exit 1; }

          pnpm install --frozen-lockfile

          # ── 原子构建切换（BUG-87）──────────────────────────────
          # 关键：绝不在构建前删/动线上 .next。先构建到临时目录 .next.new，
          # 校验完整后再原子换成 .next；构建或校验失败则线上 .next 与运行进程纹丝不动。
          rm -rf .next.new
          echo ">> 构建到临时目录 .next.new（线上 .next 不受影响）"
          echo ">> 构建前内存：$(free -m | awk '/^Mem:/{print "可用 "$7"MB / 共 "$2"MB"}')，swap $(free -m | awk '/^Swap:/{print "已用 "$3"MB / 共 "$2"MB"}')"
          # 🔴 OPS-1：构建失败时把退出码翻译成人话。
          # 此前 OOM 的全部线索只有一行 `Killed` + exit 137，不写明是内存问题，
          # 两次排查都往代码/依赖方向找。137 = 128+9(SIGKILL)，即内核 OOM killer。
          if ! NEXT_DIST_DIR=.next.new pnpm build; then
            RC=$?
            if [ "$RC" -eq 137 ]; then
              echo "FATAL: 构建进程被内核杀死（exit 137 = SIGKILL，几乎必然是 OOM）"
              echo "       构建后内存：$(free -m | awk '/^Mem:/{print "可用 "$7"MB"}')"
              echo "       本机同时跑着 Dify / deskmate 等服务，构建期内存峰值会撞车。"
              echo "       这是偶发失败：同一份代码重跑常能成功；线上未受影响（.next 未动，源码将回退）。"
            else
              echo "FATAL: 构建失败（exit $RC）——非 OOM，请看上方构建日志"
            fi
            rm -rf .next.new
            exit "$RC"
          fi

          echo ">> 校验新构建完整性"
          MISSING=""
          for f in .next.new/BUILD_ID .next.new/prerender-manifest.json .next.new/required-server-files.json .next.new/routes-manifest.json; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          [ -d .next.new/static ] || MISSING="$MISSING .next.new/static/"
          if [ -n "$MISSING" ]; then
            echo "FATAL: 新构建不完整，缺:$MISSING —— 放弃切换，线上保持旧版本"
            rm -rf .next.new
            exit 1
          fi

          echo ">> 原子切换 .next.new → .next（保留旧版 .next.old 供回滚）"
          rm -rf .next.old
          mv .next .next.old
          mv .next.new .next
          # fork 模式用 restart（reload 在 fork 模式不保证干净重启），强制进程重读新 .next
          pm2 restart aipaddle --update-env

          # 真实健康检查：直连 :3000 请求一个 CSS 静态资源，连续拿到 200 才算健康。
          # 任何原因（进程崩/静态 500/构建怪异）导致不健康 → 自动回滚到旧构建 .next.old，
          # 保证线上永远不停在坏状态（BUG-86 裸奔的根治性防线）。
          CSSFILE=$(ls .next/static/css/*.css 2>/dev/null | head -1 | xargs -r -n1 basename 2>/dev/null || true)
          PROBE="http://localhost:3000/login"
          [ -n "$CSSFILE" ] && PROBE="http://localhost:3000/_next/static/css/$CSSFILE"
          HEALTHY=0; CODE=""
          for i in 1 2 3 4 5 6 7 8; do
            sleep 2
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$PROBE" || true)
            [ "$CODE" = "200" ] && { HEALTHY=$((HEALTHY+1)); } || HEALTHY=0
            [ "$HEALTHY" -ge 3 ] && break   # 连续 3 次 200 才判健康，防抖
          done
          if [ "$HEALTHY" -lt 3 ]; then
            echo "FATAL: 新版本健康检查失败（最后 code=$CODE, probe=$PROBE）→ 回滚旧构建 .next.old"
            rm -rf .next.broken; mv .next .next.broken; mv .next.old .next
            pm2 restart aipaddle --update-env
            exit 1
          fi

          # 🔴 只有走到这里才算成功——置标志，否则 EXIT trap 会把刚上线的源码退回去
          DEPLOY_OK=1
          pm2 save
          echo "部署完成（健康检查连续 3×200）: $(git log --oneline -1)"
          REMOTE

      - name: 冒烟检查（login + CSS 静态资源都要 200）
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            login=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://aipaddle.net/login || true)
            # 从 login HTML 里取第一个 CSS 资源，验证静态资源也能 200（防"进程崩→静态 500"裸奔）
            css=$(curl -s --max-time 15 https://aipaddle.net/login | grep -oE '/_next/static/css/[a-f0-9]+\.css' | head -1 || true)
            csscode="none"
            [ -n "$css" ] && csscode=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://aipaddle.net${css}" || true)
            if [ "$login" = "200" ] && [ "$csscode" = "200" ]; then
              echo "冒烟通过：login=200, css($css)=200"; ok=1; break
            fi
            echo "第 $i 次: login=$login css=$csscode，10s 后重试…"; sleep 10
          done
          [ "$ok" = "1" ] || { echo "冒烟失败：login 或 CSS 未稳定 200"; exit 1; }
